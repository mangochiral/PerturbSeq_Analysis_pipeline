# Environment for the CRISPRa sgRNA re-annotation pipeline (Phases 3-6).
# Phases 1-2 (unified table + frameshift-twin dedup) run under base conda.
# Create with:  conda env create -f environment.yml   then  conda activate crispra_sgrna
name: crispra_sgrna
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - bowtie2
  - pysam
  - biopython
  - pyfaidx
  - gffutils
  - pandas
  - numpy
  - pyarrow      # parquet I/O
  - jupyter
